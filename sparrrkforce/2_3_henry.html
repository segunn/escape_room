<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparrrkforce</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript" src="assets/progress.js"></script>
</head>
<body onload="updateStats()">
    <div class="status_bar">
       <div class="status">
        🏴‍☠️ <span id="stars_complete">0</span>/12
        </div>
    </div>
    <div class="section">
        <h1>Henry IV Parrot I</h1>
        <div class="imgbox">
            <img class="center-fit" src='./assets/polly3.png'>
        </div>
        <p>
            <em>
                Apparently this parrot is a poet<br/>
                A birdcage got him used to being bard<br/>
                Quite where he acquires quills we do not know yet<br/>
                And his spelling is especially uninspired.
            </em>
        </p>
        <p>
            Find Henry and decode the message hidden in his poem.
        </p>
        <div class="answer_box">
            <span class="fa fa-solid fa-lg fa-terminal"></span>
            <input id="answer" type="text" class="input-field" placeholder="Enter answer...">
        </div>
        <div class="actions">
            <a class="button" id="submit" onclick="checkAnswer('captain', '2', '3')">Submit</button>
            <a class="button" href="index.html">Quests List</a>
        </div>
    </div>
</body>
</html>
