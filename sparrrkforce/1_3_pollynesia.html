<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparrrkforce</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript" src="assets/progress.js"></script>
</head>
<body onload="updateStats()">
    <div class="status_bar">
       <div class="status">
        🏴‍☠️ <span id="stars_complete">0</span>/12
        </div>
    </div>
    <div class="section">
        <h1>Pollynesia</h1>
        <div class="imgbox">
            <img class="center-fit" src='./assets/polly2.png'>
        </div>
        <p>
            <em>
                Polly is just back from a lengthy voyage, but he's struggling to remember which countries he visited.
            </em>
        </p>
        <p>
            Find Polly and work out where he's been. Take the first letter of each country to spell the treasure.
        </p>
        <div class="answer_box">
            <span class="fa fa-solid fa-lg fa-terminal"></span>
            <input id="answer" type="text" class="input-field" placeholder="Enter answer...">
        </div>
        <div class="actions">
            <a class="button" id="submit" onclick="checkAnswer('actinium', '1', '3')">Submit</button>
            <a class="button" href="index.html">Quests List</a>
        </div>
    </div>
</body>
</html>
